version: 1
# 実装 nemotron-3-super:120b-a12b (約65GB、128GB Mac に降ろせる)
# レビュー gemma4:31b (20GB、同上)
# それ以外(plan / 裁定 / fix-verifier / final-gate / loop-judge)は luna
companion:
  enabled: false
provider:
  profiles:
    luna-max:
      provider: codex
      model: gpt-5.6-luna
      options:
        network_access: true
        reasoning_effort: xhigh
    reviewer-local:
      provider: opencode
      model: ollama-cloud/gemma4:31b
      options:
        guards:
          call_timeout_ms: 10800000
    coder-local:
      provider: opencode
      model: ollama-cloud/nemotron-3-super
      options:
        guards:
          call_timeout_ms: 10800000
  defaults:
    profile: luna-max
  targets:
    personas:
      coder: { profile: coder-local }
    tags:
      review: { profile: reviewer-local }
