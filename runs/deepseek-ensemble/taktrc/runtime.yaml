version: 1
companion:
  enabled: false
provider:
  profiles:
    luna-max:
      provider: codex
      model: gpt-5.6-luna
      options:
        network_access: true
        reasoning_effort: xhigh
    sol-high:
      provider: codex
      model: gpt-5.6-sol
      options:
        network_access: true
        reasoning_effort: high
    reviewer-local:
      provider: opencode
      model: ollama-cloud/gemma4:31b
    coder-x:
      provider: opencode
      model: ollama-cloud/deepseek-v4-flash
      options:
        guards:
          call_timeout_ms: 10800000
  defaults:
    profile: luna-max
  targets:
    steps:
      review-adjudication: { profile: sol-high }
      final-gate: { profile: sol-high }
      fix-verifier: { profile: luna-max }
    personas:
      planner: { profile: sol-high }
      supervisor: { profile: sol-high }
      loop-judge: { profile: sol-high }
      coder: { profile: coder-x }
    tags:
      review: { profile: reviewer-local }
    companions:
      ai-antipattern-review-companion: { profile: reviewer-local }
      ai-antipattern-review-moderator: { profile: luna-max }
