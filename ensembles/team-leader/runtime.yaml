version: 1
provider:
  profiles:
    codex-sol:
      provider: codex
      model: gpt-5.6-sol
      options: { reasoning_effort: high }
    codex-luna:
      provider: codex
      model: gpt-5.6-luna
      options: { reasoning_effort: xhigh }
    deepseek-v4-flash:
      provider: opencode
      model: ollama-cloud/deepseek-v4-flash
    nemotron-3-super:
      provider: opencode
      model: ollama-cloud/nemotron-3-super
    gemma4:
      provider: opencode
      model: ollama-cloud/gemma4:31b
  defaults:
    profile: codex-luna          # リーダー・計画・裁定・検証・マージ判定
  targets:
    tags:
      coding-part: { profile: nemotron-3-super }    # 分割された実装の実働
      review: { profile: gemma4 }
