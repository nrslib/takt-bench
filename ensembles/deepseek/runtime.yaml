version: 1
provider:
  profiles:
    codex-sol:
      provider: codex
      model: gpt-5.6-sol
      options: { reasoning_effort: high }
    codex-luna:
      provider: codex
      model: gpt-5.6-luna
      options: { reasoning_effort: xhigh }
    deepseek-v4-flash:
      provider: opencode
      model: ollama-cloud/deepseek-v4-flash
    nemotron-3-super:
      provider: opencode
      model: ollama-cloud/nemotron-3-super
    gemma4:
      provider: opencode
      model: ollama-cloud/gemma4:31b
  defaults:
    profile: codex-sol           # 指定のないロールはすべて Sol(計画、裁定、マージ判定はここに落ちる)
  targets:
    personas:
      coder: { profile: deepseek-v4-flash }         # 実装
    steps:
      fix-verifier: { profile: codex-luna }         # 修正の検証
      fix-plan: { profile: gemma4 }                 # 修正計画(実測に合わせた割り当て)
    tags:
      review: { profile: gemma4 }                   # レビュアー(4〜6並列)
